<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#bg1)"/>
  <polygon points="0,700 260,700 480,0 220,0" fill="#7C3AED" opacity="0.10"/>
  <!-- Camera body -->
  <rect x="220" y="290" width="180" height="120" rx="14" fill="none" stroke="#F59E0B" stroke-width="8"/>
  <!-- Lens ring -->
  <circle cx="310" cy="350" r="34" fill="none" stroke="#F59E0B" stroke-width="7"/>
  <circle cx="310" cy="350" r="16" fill="#F59E0B" opacity="0.25"/>
  <!-- Camera lens highlight -->
  <circle cx="310" cy="350" r="6" fill="#F59E0B"/>
  <!-- Viewfinder triangle / trapezoid -->
  <polygon points="400,300 480,260 480,440 400,400" fill="none" stroke="#2563EB" stroke-width="7" stroke-linejoin="round"/>
  <!-- Mount pole -->
  <line x1="310" y1="410" x2="310" y2="470" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
  <line x1="260" y1="470" x2="360" y2="470" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
  <!-- Label -->
  <text x="350" y="540" font-family="sans-serif" font-size="22" fill="#64748B" text-anchor="middle" letter-spacing="3">CCTV INSTALLATION</text>
</svg>
