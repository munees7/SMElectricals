<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#bg2)"/>
  <polygon points="700,0 440,0 220,700 480,700" fill="#2563EB" opacity="0.08"/>
  <!-- Monitor / DVR screen -->
  <rect x="190" y="240" width="240" height="170" rx="12" fill="none" stroke="#2563EB" stroke-width="8"/>
  <!-- Screen inner -->
  <rect x="208" y="258" width="204" height="134" rx="6" fill="#2563EB" opacity="0.12"/>
  <!-- Play icon on screen -->
  <polygon points="282,295 282,360 342,327" fill="#F59E0B" opacity="0.85"/>
  <!-- Stand -->
  <line x1="310" y1="410" x2="310" y2="460" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
  <line x1="265" y1="460" x2="355" y2="460" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
  <!-- Remote / signal waves -->
  <path d="M460,290 Q490,327 460,364" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
  <path d="M480,268 Q524,327 480,386" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="452" cy="327" r="7" fill="#F59E0B"/>
  <!-- Label -->
  <text x="350" y="540" font-family="sans-serif" font-size="22" fill="#64748B" text-anchor="middle" letter-spacing="3">DVR / REMOTE MONITORING</text>
</svg>
